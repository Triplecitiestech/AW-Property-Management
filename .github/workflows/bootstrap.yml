name: Bootstrap (run once — sets Vercel env vars + runs DB migration)

# Trigger manually from:
# https://github.com/Triplecitiestech/AW-Property-Management/actions/workflows/bootstrap.yml
#
# Requires these GitHub Actions secrets to be set first
# (Settings > Secrets and variables > Actions):
#   VERCEL_TOKEN, SUPABASE_ACCESS_TOKEN, SUPABASE_PROJECT_REF,
#   NEXT_PUBLIC_SUPABASE_URL, NEXT_PUBLIC_SUPABASE_ANON_KEY,
#   SUPABASE_SERVICE_ROLE_KEY, NEXT_PUBLIC_APP_URL, RESEND_API_KEY,
#   RESEND_FROM_EMAIL, NOTIFY_EMAIL, TWILIO_ACCOUNT_SID, TWILIO_AUTH_TOKEN,
#   TWILIO_PHONE_NUMBER
#
# After this workflow succeeds:
#   • Vercel will have all environment variables configured.
#   • The Supabase migration will have run.
#   • Merge the branch to main to trigger production deploy.

on:
  workflow_dispatch:

jobs:
  bootstrap:
    name: Set Vercel env vars + run Supabase migration
    runs-on: ubuntu-latest

    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      NEXT_PUBLIC_APP_URL: ${{ secrets.NEXT_PUBLIC_APP_URL }}
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      RESEND_FROM_EMAIL: ${{ secrets.RESEND_FROM_EMAIL }}
      NOTIFY_EMAIL: ${{ secrets.NOTIFY_EMAIL }}
      TWILIO_ACCOUNT_SID: ${{ secrets.TWILIO_ACCOUNT_SID }}
      TWILIO_AUTH_TOKEN: ${{ secrets.TWILIO_AUTH_TOKEN }}
      TWILIO_PHONE_NUMBER: ${{ secrets.TWILIO_PHONE_NUMBER }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Step 1 — Push all env vars to Vercel
        run: node scripts/setup-vercel-env.mjs

      - name: Step 2 — Run Supabase migration
        run: node scripts/run-migration.mjs

      - name: Done
        run: |
          echo "✓ Vercel environment variables configured"
          echo "✓ Supabase migration complete"
          echo ""
          echo "Merge branch to main to trigger production deploy."
