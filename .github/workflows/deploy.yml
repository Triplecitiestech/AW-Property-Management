name: Deploy to Vercel

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest

    # All credentials and configuration come from GitHub Actions secrets
    # (Settings > Secrets and variables > Actions). Nothing sensitive or
    # project-specific is stored in this file.
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      NEXT_PUBLIC_APP_URL: ${{ secrets.NEXT_PUBLIC_APP_URL }}
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      RESEND_FROM_EMAIL: ${{ secrets.RESEND_FROM_EMAIL }}
      NOTIFY_EMAIL: ${{ secrets.NOTIFY_EMAIL }}
      TWILIO_ACCOUNT_SID: ${{ secrets.TWILIO_ACCOUNT_SID }}
      TWILIO_AUTH_TOKEN: ${{ secrets.TWILIO_AUTH_TOKEN }}
      TWILIO_PHONE_NUMBER: ${{ secrets.TWILIO_PHONE_NUMBER }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Build
        run: npm run build

      - name: Install Vercel CLI
        run: npm install -g vercel@latest

      - name: Resolve Vercel org + project IDs
        # Fetches the team ID by slug, then the project ID by name.
        # Sets VERCEL_ORG_ID and VERCEL_PROJECT_ID which the Vercel CLI reads
        # automatically — no .vercel/project.json needed.
        run: |
          TEAM_ID=$(curl -sf "https://api.vercel.com/v1/teams/Triplecitiestech" \
            -H "Authorization: Bearer $VERCEL_TOKEN" | jq -r '.id')

          PROJECT_ID=$(curl -sf \
            "https://api.vercel.com/v9/projects/AW-Property-Management?teamId=${TEAM_ID}" \
            -H "Authorization: Bearer $VERCEL_TOKEN" | jq -r '.id')

          echo "VERCEL_ORG_ID=${TEAM_ID}"     >> "$GITHUB_ENV"
          echo "VERCEL_PROJECT_ID=${PROJECT_ID}" >> "$GITHUB_ENV"

          echo "Org: ${TEAM_ID}  Project: ${PROJECT_ID}"

      - name: Push env vars to Vercel project
        # Ensures NEXT_PUBLIC_* and server-side vars are set on the project
        # before Vercel's build servers run next build.  Safe to re-run.
        run: node scripts/setup-vercel-env.mjs

      - name: Deploy to Vercel
        id: deploy
        run: |
          URL=$(vercel deploy --prod --token="$VERCEL_TOKEN")
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "Deployed: $URL"
