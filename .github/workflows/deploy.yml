name: Deploy to Vercel

on:
  push:
    branches:
      - main
  workflow_dispatch:

# No credentials live in this file. All runtime env vars are set on the Vercel
# project itself (aw-property-management), so Vercel's remote build picks them
# up automatically — this workflow never pushes env vars.
#
# The deploy step requires the VERCEL_TOKEN repository secret. If it is not
# set, the deploy step is skipped; Vercel's GitHub integration still builds
# every push to the linked repository.

jobs:
  deploy:
    name: Check + deploy
    runs-on: ubuntu-latest
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Build
        run: npm run build

      - name: Deploy to Vercel (production)
        if: env.VERCEL_TOKEN != ''
        run: |
          npm install -g vercel@latest

          TEAM_ID=$(curl -sf "https://api.vercel.com/v1/teams/Triplecitiestech" \
            -H "Authorization: Bearer $VERCEL_TOKEN" | jq -r '.id')

          PROJECT_ID=$(curl -sf \
            "https://api.vercel.com/v9/projects/AW-Property-Management?teamId=${TEAM_ID}" \
            -H "Authorization: Bearer $VERCEL_TOKEN" | jq -r '.id')

          export VERCEL_ORG_ID="$TEAM_ID" VERCEL_PROJECT_ID="$PROJECT_ID"

          URL=$(vercel deploy --prod --token="$VERCEL_TOKEN")
          echo "Deployed: $URL"

      - name: Deploy skipped (no VERCEL_TOKEN secret)
        if: env.VERCEL_TOKEN == ''
        run: echo "VERCEL_TOKEN repository secret is not set — CLI deploy skipped."
