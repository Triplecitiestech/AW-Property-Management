name: Run Supabase Migrations

# Manual migration runner. Requires the SUPABASE_ACCESS_TOKEN repository
# secret (a Supabase personal access token). No credentials live in this file.

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "migrate" to confirm running migrations against production'
        required: true

jobs:
  migrate:
    name: Run migrations
    runs-on: ubuntu-latest
    if: github.event.inputs.confirm == 'migrate'

    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: vixpadnfeguwajummnfo

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run migration via Supabase Management API
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::SUPABASE_ACCESS_TOKEN repository secret is not set"
            exit 1
          fi
          node scripts/run-migration.mjs
