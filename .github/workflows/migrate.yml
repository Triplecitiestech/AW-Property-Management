name: Run Supabase Migrations

# Requires these GitHub Actions secrets:
#   SUPABASE_ACCESS_TOKEN  — a Supabase personal access token (sbp_...)
#   SUPABASE_PROJECT_REF   — the target project ref

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "migrate" to confirm running migrations against production'
        required: true

jobs:
  migrate:
    name: Run migrations
    runs-on: ubuntu-latest
    if: github.event.inputs.confirm == 'migrate'

    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run migration via Supabase Management API
        run: node scripts/run-migration.mjs
